name: dootdoot
description: Unofficial Flutter companion for tududi (free / community build).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dootdoot_app:
    path: ../../packages/dootdoot_app
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  dootdoot_design:
    path: ../../packages/design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
