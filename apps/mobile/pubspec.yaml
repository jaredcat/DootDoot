name: dootdoot
description: Unofficial Flutter companion for tududi (free / community build).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dootdoot_app:
    path: ../../packages/dootdoot_app
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  dootdoot_design:
    path: ../../packages/design
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1962F8"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
