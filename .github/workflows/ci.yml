name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          dart analyze packages/tududi_api
          # Flutter packages need the Flutter analyzer (dart:ui).
          flutter analyze packages/design packages/dootdoot_app packages/pro_api
          cd apps/mobile && flutter analyze
      - name: Test
        run: |
          dart test packages/tududi_api
          # Flutter packages must use flutter test; dart test lacks dart:ui.
          flutter test packages/design packages/dootdoot_app
          cd apps/mobile && flutter test
