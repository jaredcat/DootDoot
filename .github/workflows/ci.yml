name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          dart analyze packages/tududi_api
          dart analyze packages/design
          cd apps/mobile && flutter analyze
      - name: Test
        run: |
          dart test packages/tududi_api
          dart test packages/design
          cd apps/mobile && flutter test
