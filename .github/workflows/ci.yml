name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          dart analyze --fatal-infos packages/tududi_api
          # Flutter packages need the Flutter analyzer (dart:ui).
          flutter analyze --fatal-infos packages/design packages/dootdoot_app packages/pro_api
          cd apps/mobile && flutter analyze --fatal-infos
      - name: Test
        run: |
          dart test packages/tududi_api
          # Flutter packages must use flutter test; dart test lacks dart:ui.
          # Run inside each package so its asset bundle includes material_ui's
          # ink sparkle shader. A workspace-root flutter test does not.
          (cd packages/design && flutter test)
          (cd packages/dootdoot_app && flutter test)
          (cd apps/mobile && flutter test)
